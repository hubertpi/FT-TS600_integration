set_digital:
  name: Set digital feedback
  description: Set the state of a digital join on the touchpanel.
  fields:
    join:
      required: true
      selector:
        number:
          min: 1
          max: 32768
          mode: box
    value:
      required: true
      selector:
        boolean:
reconnect:
  name: Reconnect touchpanel
  description: Close the current connection and let the panel sign on again.
